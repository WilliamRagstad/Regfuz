name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/refuzz-install
      - run: /tmp/refuzz-install/bin/python -m pip install --no-deps dist/*.whl
      - run: python tests/check_install.py /tmp/refuzz-install/bin/python
